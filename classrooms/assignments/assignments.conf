- name: 'assignment-1' # (Required) Must match name of assignment's template directory, if one exists
  key: 'ASSIGNMENT_1_KEY' # (Optional) Key / password required to accept assignment. If omitted or empty, no key is required to accept assignment.
  student_role: 'push' # (Optional) Student's role in repository. Default is push (write access). Options: {'push', 'maintain', 'admin', 'pull', 'triage'}
  release_at: '2026-09-02T08:00:00' # (Optional) Datetime after which students can accept the assignment, unless overridden per-section or per-student. Format is ISO 8601 without time zone designator (classroom's time zone UTC offset is used as designator): 'YYYY-MM-DDhh:mm:ss'. If omitted or empty, assignment is released immediately.
  release_at_section_start: true # (Optional) If true, establishes a "release window" for each class section, with a given section's release window starting at the section's next start time following `release_at`. If a student is assigned to multiple sections, they can accept the assignment so long as at least one of their sections' release windows would allow it. If a student is not assigned to any sections, then they cannot accept the assignment unless reconfigured in `student_overrides`. If `release_at` is omitted, this field is ignored. If false, the assignment is released according to `release_at`. Default: false.
  unrelease_at_section_end: true # (Optional) If true, the assignment is instead unreleased to a given student at the end of their first class section immediately following `unrelease_at`. If a student is assigned to multiple sections, they can accept the assignment so long as at least one of their sections' configured times would allow it. If `unrelease_at` is omitted, this field is ignored. If false, the assignment is unreleased according to `release_at`. Default: false.
  section_overrides: # (Optional) Explicit per-section configuration overrides.
    - section: 'lab-section-2' # (Required) Must match section's name in classroom.conf exactly (case-sensitive)
      key: 'ASSIGNMENT_1_KEY_LAB_2' # (Optional) i.e., for lab-section-2, the accept key is 'ASSIGNMENT_1_KEY_LAB_2' instead of 'ASSIGNMENT_1_KEY'
      release_at: '2026-09-03T08:00:00' # (Optional) i.e., for lab-section-2, this assignment will be released at 8:00 AM on Sep 3rd, 2026.
      unrelease_at: '2026-09-03T10:00:00' # (Optional) i.e., for lab-section-2, this assignment will be unreleased (no longer acceptable) at 10:00 AM on Sep 3rd, 2026.
      release_at_section_start: false # (Optional) i.e., override assignment's global `release_at_section_start: true` value. If left as true, then lab-section-2's acceptance time for this assignment would be during the first lab-section-2 meeting following 2026-09-0308:00:00
      unrelease_at_section_end: false # (Optional) i.e., override assignment's global `unrelease_at_section_end: true` value. If left as true, then this assignment would be unreleased for lab-section-2 at the end of the first lab-section-2 meeting following 2026-09-0310:00:00
    - section: 'lab-section-3'
      key: 'ASSIGNMENT_1_KEY_LAB_3'
  student_overrides: # (Optional) Explicit per-student configuration overrides
    - github_username: 'example-student-github-username-2' # (Required) Must match student's GitHub username in classroom.conf exactly (case-sensitive)
      key: 'ASSIGNMENT_1_KEY_ABC' # (Optional) i.e., for example-student-github-username-2, the accept key is 'ASSIGNMENT_1_KEY_ABC' instead of 'ASSIGNMENT_1_KEY'
      release_at: '2026-09-03T07:30:00' # (Optional) i.e., for example-student-github-username-2, this assignment will be released at 7:30 AM on Sep 3rd, 2026.
      release_at_section_start: false # (Optional) i.e., override assignment's global `release_at_section_start: true` value. If left as true, then this student would only be able to accept the assignment during the first meeting of each of their assigned sections following 2026-09-0307:30:00
- name: 'assignment-2' # Note: there's no template directory for assignment-2. When accepted, the student's generated repository will be empty with no commits.
  key: 'ASSIGNMENT_2_KEY'
  student_role: 'maintain' # Gives student maintainer access to their repository (e.g., so they can invite collaborators)
- name: 'assignment-3'
  student_role: 'push'
  # Notice: No accept key for assignment-3. If the accept key is omitted (or the assignment has a template directory but no entry in assignments.conf), then no accept key is necessary to accept the assignment.
