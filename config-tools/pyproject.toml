[project]
name = "config-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "cryptography>=50.0.0",
    "idna==3.18",
    "pyjwt>=2.13.0",
    "pynacl>=1.6.2",
    "pyyaml>=6.0.3",
    "requests==2.34.2",
    "rich>=15.0.0",
    "types-pyyaml>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]
python_executable = ".venv/bin/python"
