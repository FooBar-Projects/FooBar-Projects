name: Build site and deploy to GH Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      PUBLIC_PATH: ${{ vars.PUBLIC_PATH }}
      WEB_WORKFLOW_DISPATCH_POLL_DELAY: ${{ vars.WEB_WORKFLOW_DISPATCH_POLL_DELAY }}
      BACKEND_REPO_OWNER: ${{ vars.BACKEND_REPO_OWNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build static site
        working-directory: web/static/
        run: |
          # Inject build vars into config/build.conf, which gets read by
          # webpack.prod.js
          mkdir -p config
          echo "publicPath: '${PUBLIC_PATH}'" >> config/build.conf

          # Inject application vars into src/config/conf.yaml.
          mkdir -p src/config
          echo "pollDelay: ${WEB_WORKFLOW_DISPATCH_POLL_DELAY}" >> src/config/conf.yaml
          echo "backendRepoOwner: '${BACKEND_REPO_OWNER}'" >> src/config/conf.yaml

          # Build
          npm i
          npm run build
          
      - name: Upload static frontend files as pages artifact
        id: deploy_static_site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/static/dist/

  deploy-static-site:
    environment:
      name: github-pages
      url: ${{ steps.deploy_static_site.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
